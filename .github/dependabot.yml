#
# Dependabot configuration.
#
# The `ignore` entries below cover three things, for two different reasons.
#
# Two are advisories that cannot be fixed from this repository. Dependabot's
# update job fails when it cannot produce a security update, so leaving them
# enabled turns every run red:
#
#   undici 6.29.0  - reached only through semantic-release -> @semantic-release/npm
#                    -> npm -> node-gyp. npm vendors this dependency inside its own
#                    tarball (inBundle: true), so neither an `overrides` entry nor a
#                    lockfile edit reaches it; `npm ci` restores 6.29.0. npm 11.21.1
#                    and 12.2.1 both still bundle 6.29.0, so there is no release to
#                    move to. Dependabot reports: "Security update not possible for
#                    undici ... latest possible version is 6.29.0".
#
#   elliptic 6.6.1 - dev-only, via @nextcloud/vite-config -> node-stdlib-browser.
#                    6.6.1 is the latest published version, so no fix exists.
#                    Dependabot reports: "Security update not found for elliptic ...
#                    dependency is up to date but still vulnerable".
#
# Revisit the two advisories when npm ships a patched undici, or when a patched
# elliptic is published. The third entry is a version-policy pin, not a
# vulnerability waiver: it holds TypeScript at 5.x until the lint toolchain
# supports a newer major. See the comment on that entry.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The range must cover the version Dependabot would try to move to, not
      # just the vulnerable one: `ignore.versions` matches the *target* version,
      # so "<6.29.1" would still attempt 6.29.1 and leave the job red. 6.29.1 is
      # the earliest patched release and is unreachable here, so it is included.
      - dependency-name: undici
        versions:
          - "<=6.29.1"
      # 6.6.1 is the newest published version, so no fix exists yet. Scoped to
      # this version range rather than the package, so a future patched release
      # is still picked up automatically.
      - dependency-name: elliptic
        versions:
          - "<=6.6.1"
      # TypeScript majors break the lint toolchain. A major bump (for example
      # 5.9.3 -> 7.0.2) makes `npm ci` fail with ERESOLVE and leaves eslint
      # hanging, because:
      #   - openapi-typescript peer-requires typescript@^5.x, and
      #   - @typescript-eslint/parser (via typescript-eslint) peer-requires
      #     typescript >=4.8.4 <6.1.0, and crashes on TypeScript 7 with
      #     "Cannot read properties of undefined (reading 'Cjs')".
      # Neither package supports TypeScript 7 yet, at any published version.
      #
      # This uses `versions` rather than `update-types`: per the Dependabot docs,
      # "update-types only affects version updates, not security updates", so an
      # `update-types: [version-update:semver-major]` entry would still let a
      # TypeScript security update propose 7.x and break the toolchain. `versions`
      # is not exempt, so it covers both kinds of update.
      #
      # 5.x minor and patch updates still flow through. Delete this entry once
      # typescript-eslint and openapi-typescript raise their TypeScript caps.
      - dependency-name: typescript
        versions:
          - ">=6.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
